<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Food Recipe</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 15% 25%,
                    rgba(255, 166, 0, 0.15),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 85% 75%,
                    rgba(63, 125, 88, 0.12),
                    transparent 30%
                ),

                #f8f8f8;

            color: #222;
        }


        /* ================= NAVBAR ================= */

        .navbar {
            height: 72px;

            background: #292929;

            display: flex;
            align-items: center;

            padding: 0 6%;
        }


        .logo {
            width: 70px;
            height: 65px;

            object-fit: contain;
        }


        .nav-links {
            display: flex;

            gap: 30px;

            margin-left: 70px;

            flex: 1;
        }


        .nav-links a {
            color: white;

            text-decoration: none;

            font-weight: bold;

            font-size: 15px;
        }


        .nav-links a:hover {
            color: #ff9800;
        }


        .home-btn {
            color: white;

            text-decoration: none;

            border: 1px solid #ff9800;

            padding: 10px 18px;

            border-radius: 7px;

            font-weight: bold;
        }


        .home-btn:hover {
            background: #ff9800;
        }


        /* ================= LOGIN AREA ================= */

        .login-container {
            min-height: calc(100vh - 72px);

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 40px 20px;
        }


        .login-card {
            width: 450px;

            background: white;

            border-radius: 18px;

            padding: 40px;

            box-shadow:
                0 15px 45px rgba(0,0,0,0.12);

            border: 1px solid #e5e5e5;
        }


        .logo-area {
            text-align: center;

            margin-bottom: 15px;
        }


        .login-logo {
            width: 85px;
            height: 75px;

            object-fit: contain;
        }


        .login-card h1 {
            text-align: center;

            font-size: 30px;

            margin-bottom: 8px;
        }


        .subtitle {
            text-align: center;

            color: #777;

            font-size: 15px;

            margin-bottom: 30px;
        }


        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 20px;
        }


        .form-group label {
            display: block;

            font-weight: bold;

            font-size: 14px;

            margin-bottom: 8px;
        }


        .form-group input {
            width: 100%;

            height: 50px;

            border: 1px solid #ddd;

            border-radius: 8px;

            padding: 0 15px;

            font-size: 15px;

            outline: none;
        }


        .form-group input:focus {
            border-color: #f28c00;

            box-shadow:
                0 0 0 3px rgba(242,140,0,0.12);
        }


        /* ================= OPTIONS ================= */

        .login-options {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;

            font-size: 13px;
        }


        .remember {
            display: flex;

            align-items: center;

            gap: 6px;

            color: #666;
        }


        .forgot {
            color: #e77b00;

            font-weight: bold;

            cursor: pointer;
        }


        /* ================= LOGIN BUTTON ================= */

        .login-btn {
            width: 100%;

            height: 50px;

            border: none;

            border-radius: 8px;

            background: #f28c00;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        .login-btn:hover {
            background: #db7400;
        }


        /* ================= SIGNUP ================= */

        .signup-text {
            text-align: center;

            margin-top: 25px;

            color: #777;

            font-size: 14px;
        }


        .signup-text a {
            color: #e77b00;

            text-decoration: none;

            font-weight: bold;
        }


        /* ================= MESSAGE ================= */

        #message {
            display: none;

            margin-bottom: 18px;

            padding: 12px;

            border-radius: 7px;

            font-size: 14px;

            text-align: center;
        }


        .error {
            background: #ffe5e5;

            color: #c62828;
        }


        .success {
            background: #e5f7eb;

            color: #16803c;
        }


        /* ================= ADMIN ================= */

        .admin-login {
            text-align: center;

            margin-top: 22px;

            padding-top: 20px;

            border-top: 1px solid #eee;
        }


        .admin-login a {
            color: #3f7d58;

            text-decoration: none;

            font-weight: bold;

            font-size: 14px;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 700px) {

            .nav-links {
                display: none;
            }

            .navbar {
                justify-content: space-between;
            }

            .login-card {
                width: 100%;

                padding: 30px 22px;
            }

        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <img
            src="logo.png"
            class="logo"
            alt="Food Recipe Logo"
        >


        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="index.html#recipes">
                All Recipes
            </a>

            <a href="index.html#cuisines">
                Cuisines
            </a>

            <a href="index.html#planner">
                Meal Planner
            </a>

        </nav>


        <a
            href="index.html"
            class="home-btn"
        >
            ← Home
        </a>

    </header>



    <!-- ================= LOGIN ================= -->

    <main class="login-container">

        <div class="login-card">


            <div class="logo-area">

                <img
                    src="logo.png"
                    class="login-logo"
                    alt="Food Recipe"
                >

            </div>


            <h1>
                Welcome Back!
            </h1>


            <p class="subtitle">
                Login to discover delicious recipes.
            </p>


            <!-- MESSAGE -->

            <div id="message"></div>


            <!-- LOGIN FORM -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label>
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- OPTIONS -->

                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        Remember me

                    </label>


                    <span
                        class="forgot"
                        onclick="forgotPassword()"
                    >
                        Forgot Password?
                    </span>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-btn"
                >
                    Login →
                </button>


            </form>


            <!-- SIGNUP -->

            <div class="signup-text">

                Don't have an account?

                <a href="signup.html">
                    Create Account
                </a>

            </div>


            <!-- ADMIN LOGIN -->

            <div class="admin-login">

                <a href="admin-login.html">
                    🔐 Admin Login
                </a>

            </div>


        </div>

    </main>



    <!-- ================= JAVASCRIPT ================= -->

    <script>


        /* ================================================
           LOGIN
        ================================================= */

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                function(event) {

                    event.preventDefault();


                    const email =
                        document
                        .getElementById("email")
                        .value
                        .trim()
                        .toLowerCase();


                    const password =
                        document
                        .getElementById("password")
                        .value;


                    /* Get customer account */

                    const savedUser =
                        JSON.parse(
                            localStorage.getItem("user")
                        );


                    /* =================================
                       CHECK ACCOUNT
                    ================================= */

                    if (!savedUser) {

                        showMessage(
                            "No customer account found. Please create an account first.",
                            "error"
                        );

                        return;
                    }


                    /* =================================
                       CHECK EMAIL
                    ================================= */

                    if (
                        savedUser.email.toLowerCase()
                        !== email
                    ) {

                        showMessage(
                            "Incorrect email address.",
                            "error"
                        );

                        return;
                    }


                    /* =================================
                       CHECK PASSWORD
                    ================================= */

                    if (
                        savedUser.password
                        !== password
                    ) {

                        showMessage(
                            "Incorrect password.",
                            "error"
                        );

                        return;
                    }


                    /* =================================
                       LOGIN SUCCESS
                    ================================= */

                    localStorage.setItem(
                        "userLoggedIn",
                        "true"
                    );


                    /* Store logged-in customer */

                    localStorage.setItem(
                        "currentUser",
                        JSON.stringify(savedUser)
                    );


                    /* Success message */

                    showMessage(
                        "Login successful! Opening recipes...",
                        "success"
                    );


                    /* =================================
                       GO DIRECTLY TO RECIPES
                    ================================= */

                    setTimeout(
                        function() {

                            window.location.href =
                                "recipes.html";

                        },
                        800
                    );

                }
            );



        /* ================================================
           SHOW MESSAGE
        ================================================= */

        function showMessage(
            text,
            type
        ) {

            const message =
                document.getElementById(
                    "message"
                );


            message.textContent =
                text;


            message.className =
                type;


            message.style.display =
                "block";

        }



        /* ================================================
           FORGOT PASSWORD
        ================================================= */

        function forgotPassword() {

            const email =
                prompt(
                    "Enter your registered email:"
                );


            if (!email) {
                return;
            }


            const savedUser =
                JSON.parse(
                    localStorage.getItem(
                        "user"
                    )
                );


            if (
                savedUser &&
                savedUser.email
                    .toLowerCase()
                ===
                email
                    .trim()
                    .toLowerCase()
            ) {

                alert(
                    "Your password is: "
                    + savedUser.password
                );

            } else {

                alert(
                    "Email address not found."
                );

            }

        }

    </script>


</body>

</html>
